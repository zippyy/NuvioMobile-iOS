name: Build Nuvio Mobile (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite

permissions:
  contents: read

jobs:
  build-ios-full:
    name: Build iOS Full Version
    runs-on: macos-latest
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4

      - name: Fetch iOS Specific Submodule
        run: git submodule update --init --recursive MPVKit

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF

      - name: Tune Kotlin memory for CI iOS build
        run: |
          python3 - << 'PY'
          from pathlib import Path

          path = Path("gradle.properties")
          updates = {
              "kotlin.daemon.jvmargs": "-Xmx6144M",
              "kotlin.native.jvmArgs": "-Xmx10240M",
              "org.gradle.jvmargs": "-Xmx10240M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m",
              "org.gradle.workers.max": "2",
          }

          lines = path.read_text(encoding="utf-8").splitlines()
          seen = set()
          rewritten = []

          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  rewritten.append(line)
                  continue
              key = line.split("=", 1)[0].strip()
              if key in updates:
                  rewritten.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  rewritten.append(line)

          for key, value in updates.items():
              if key not in seen:
                  rewritten.append(f"{key}={value}")

          path.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

      - name: Build iOS App via Xcode
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package App into .ipa
        run: |
          cd iosApp/build/Build/Products/Release-iphoneos
          if [ ! -d Nuvio.app ]; then
            echo "Expected iosApp/build/Build/Products/Release-iphoneos/Nuvio.app was not produced by xcodebuild. Check the 'Build iOS App via Xcode' step logs in this run (expand the step output) for compilation or linker errors."
            exit 1
          fi
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Nuvio.app/Info.plist)
          mkdir Payload
          mv Nuvio.app Payload/
          zip -q -r "Nuvio-v${APP_VERSION}-Full.ipa" Payload
          echo "IPA_FILENAME=Nuvio-v${APP_VERSION}-Full.ipa" >> $GITHUB_ENV

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-Full
          path: iosApp/build/Build/Products/Release-iphoneos/${{ env.IPA_FILENAME }}