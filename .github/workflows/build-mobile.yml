name: Build Nuvio Mobile (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite
      - port/nuvio-reshaped-ios

permissions:
  contents: read

jobs:
  build-ios-full:
    name: Build iOS Full Version
    runs-on: macos-15
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v5

      - name: Fetch iOS Specific Submodule
        run: git submodule update --init --recursive MPVKit

      # macos-15 includes Xcode 26.3 / iOS 26.2; 16.4 cannot compile iOS 26 APIs.
      - name: Select iOS 26 SDK Toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Kotlin & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Nuvio Engine Apple XCFramework
        env:
          NUVIO_ENGINE_VERSION: 0.1.1
        run: |
          set -euo pipefail
          ENGINE_ROOT="../nuvio-engine/platform/apple"
          ENGINE_DEST="${ENGINE_ROOT}/NuvioEngine.xcframework"
          ARCHIVE="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip"
          EXTRACT_DIR="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}"
          rm -rf "${ENGINE_ROOT}" "${EXTRACT_DIR}" "${ARCHIVE}"
          mkdir -p "${ENGINE_ROOT}" "${EXTRACT_DIR}"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/NuvioMedia/nuvio-engine/releases/download/v${NUVIO_ENGINE_VERSION}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip" \
            --output "${ARCHIVE}"
          ditto -x -k "${ARCHIVE}" "${EXTRACT_DIR}"
          XCFRAMEWORK="$(find "${EXTRACT_DIR}" -type d -name NuvioEngine.xcframework -print -quit)"
          if [[ -z "${XCFRAMEWORK}" ]]; then echo "::error::NuvioEngine.xcframework not found"; exit 1; fi
          ditto "${XCFRAMEWORK}" "${ENGINE_DEST}"
          for SLICE in ios-arm64 ios-arm64_x86_64-simulator; do
            SLICE_DIR="${ENGINE_DEST}/${SLICE}"
            test -f "${SLICE_DIR}/libCNuvioEngine.a" || { echo "::error::Missing ${SLICE_DIR}/libCNuvioEngine.a"; exit 1; }
            test -f "${SLICE_DIR}/Headers/nuvio_engine/nuvio_engine.h" || { echo "::error::Missing ${SLICE_DIR}/Headers/nuvio_engine/nuvio_engine.h"; exit 1; }
          done
          echo "Nuvio Engine Apple XCFramework installed"

      - name: Generate local.properties
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || secrets.SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL || secrets.SUPABASE_FALLBACK_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          required = ('NUVIO_SUPABASE_URL', 'NUVIO_SUPABASE_ANON_KEY')
          values = {name: os.environ.get(name, '').strip() for name in required + ('NUVIO_SUPABASE_FALLBACK_URL',)}
          if bool(values[required[0]]) != bool(values[required[1]]):
              raise SystemExit('::error::An account-service override must provide both NUVIO_SUPABASE_URL and NUVIO_SUPABASE_ANON_KEY')
          url = urlsplit(values[required[0]])
          if values[required[0]] and (url.scheme != 'https' or not url.hostname):
              raise SystemExit('::error::NUVIO_SUPABASE_URL must be a valid HTTPS account-service URL')
          if any('\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('::error::Nuvio account configuration must be single-line values')
          Path('local.properties').write_text(''.join(f'{name}={value}\n' for name, value in values.items()))
          print('Using explicit account configuration.' if values[required[0]] else 'Using the built-in public Nuvio client configuration.')
          PY
          cat << 'EOF' >> local.properties
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF

      - name: Tune Kotlin memory for CI iOS build
        run: |
          python3 - << 'PY'
          from pathlib import Path

          path = Path("gradle.properties")
          updates = {
              "kotlin.daemon.jvmargs": "-Xmx6144M",
              "kotlin.native.jvmArgs": "-Xmx10240M",
              "kotlin.native.cacheEnrichment": "none",
              "org.gradle.jvmargs": "-Xmx10240M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m",
              "org.gradle.workers.max": "2",
          }

          lines = path.read_text(encoding="utf-8").splitlines()
          seen = set()
          rewritten = []

          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  rewritten.append(line)
                  continue
              key = line.split("=", 1)[0].strip()
              if key in updates:
                  rewritten.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  rewritten.append(line)

          for key, value in updates.items():
              if key not in seen:
                  rewritten.append(f"{key}={value}")

          path.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

      - name: Run iOS parity regression tests
        run: |
          python3 scripts/test_prepare_ios_ipa.py
          ./gradlew :composeApp:generateRuntimeConfigs \
            --console=plain --no-configuration-cache --max-workers=1
          python3 - <<'PY'
          import re
          from pathlib import Path
          config = Path('composeApp/build/generated/runtime-config/kotlin/com/nuvio/app/core/network/SupabaseConfig.kt').read_text()
          values = dict(re.findall(r'const val (URL|ANON_KEY) = "([^\"]*)"', config))
          if not values.get('URL', '').startswith('https://') or not values.get('ANON_KEY'):
              raise SystemExit('::error::Generated Nuvio account configuration is missing or invalid')
          print('Generated Nuvio account configuration verified; key is not logged.')
          PY
          ./gradlew :composeApp:iosSimulatorArm64Test \
            --console=plain --no-configuration-cache --max-workers=1 \
            --tests 'com.nuvio.app.features.livetv.*' \
            --tests 'com.nuvio.app.features.connection.*' \
            --tests 'com.nuvio.app.features.shuffle.*' \
            --tests 'com.nuvio.app.features.artwork.*' \
            --tests 'com.nuvio.app.features.mdblist.*' \
            --tests 'com.nuvio.app.features.torrent.*' \
            --tests 'com.nuvio.app.features.trailer.YouTubeStreamResolverTest*' \
            --tests 'com.nuvio.app.features.player.Subtitle*' \
            --tests 'com.nuvio.app.features.streams.*Connection*' \
            --tests 'com.nuvio.app.features.player.SeekPreviewCueTest*' \
            --tests 'com.nuvio.app.features.player.VolumeBoostTest*' \
            --tests 'com.nuvio.app.core.sync.Reshaped*'

      - name: Upload parity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-parity-test-results
          if-no-files-found: warn
          path: |
            composeApp/build/test-results/
            composeApp/build/reports/tests/

      - name: Build iOS App via Xcode
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package App into .ipa
        run: |
          set -euo pipefail
          cd iosApp/build/Build/Products/Release-iphoneos
          if [ ! -d Nuvio.app ]; then
            echo "Expected iosApp/build/Build/Products/Release-iphoneos/Nuvio.app was not produced by xcodebuild. Check the 'Build iOS App via Xcode' step logs in this run (expand the step output) for compilation or linker errors."
            exit 1
          fi
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Nuvio.app/Info.plist)
          mkdir -p Payload
          ditto Nuvio.app Payload/Nuvio.app
          zip -q -r "Nuvio-v${APP_VERSION}-Full.ipa" Payload
          python3 "${GITHUB_WORKSPACE}/scripts/prepare-ios-ipa.py" \
            "Nuvio-v${APP_VERSION}-Full.ipa" --report "${RUNNER_TEMP}/ipa-package-audit.json"
          unzip -tq "Nuvio-v${APP_VERSION}-Full.ipa"
          echo "IPA_FILENAME=Nuvio-v${APP_VERSION}-Full.ipa" >> "$GITHUB_ENV"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-Full
          if-no-files-found: error
          path: |
            iosApp/build/Build/Products/Release-iphoneos/${{ env.IPA_FILENAME }}
            ${{ runner.temp }}/ipa-package-audit.json
